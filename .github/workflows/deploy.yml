name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 赋予 GITHUB_TOKEN 发布 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发冲突
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 注意：本仓库不提交 package-lock.json。
      # 原因：开发机是 Windows，生成的 lock 只记录 win32 原生二进制
      #（@esbuild/win32-x64、@rollup/rollup-win32-x64-*），Linux runner 上会缺少
      # 对应平台的原生二进制，导致 vite build 直接失败（exit 1）。
      # 这里每次用 npm install 在 Linux runner 上重新解析，自动安装 linux 原生二进制。
      - run: npm install --no-audit --no-fund
      # 构建两个子应用（user / manage）+ 拷贝入口门户到 dist 根。
      # 诊断：把构建错误作为 GitHub annotation 输出，便于无 token 时也能看到真实报错。
      - name: Build (with error capture)
        run: |
          set -o pipefail
          npm run build > build.log 2>&1 || {
            echo "::error::BUILD_FAILED"
            echo "::error::$(tail -n 50 build.log)"
            exit 1
          }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
