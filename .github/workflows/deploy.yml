name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 赋予 GITHUB_TOKEN 发布 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发冲突
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # 注意：本仓库的 package-lock.json 在部分环境下会缺少 resolved/integrity 字段，
      # 严格模式的 `npm ci` 会直接失败（exit 1）。改用 `npm install`：它会自动从 registry
      # 解析依赖并补齐 lockfile，在 CI 环境中可正常安装与构建。
      - run: npm install --no-audit --no-fund
      # 构建两个子应用（user / manage）+ 拷贝入口门户到 dist 根
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
